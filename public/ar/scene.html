<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3"><title>Exploradores — realidade aumentada</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px var(--font-body);color:var(--ink);background:transparent}#gestures{position:fixed;inset:0;z-index:4;touch-action:none}#standalone{display:none;position:fixed;inset:auto 12px 12px;z-index:6;background:var(--surface-warm);padding:16px;border-radius:var(--radius-card)}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 12px;background:var(--lavender);color:var(--ink);border:1px solid var(--border-control);border-radius:var(--radius-button);font:inherit;text-decoration:none;margin:3px}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}#start{position:fixed;inset:25% 10% auto;z-index:7;background:var(--peach-soft);padding:24px;border-radius:var(--radius-card);text-align:center}a-scene{position:absolute;inset:0}</style>
<script src="../vendor/aframe-1.6.0.min.js"></script><script src="../vendor/ar-3.4.7.js"></script></head>
<body><div id="gestures" aria-label="Arraste para girar o modelo; use a pinça para ampliar"></div><section id="standalone"><p id="status" role="status">Preparando a câmera…</p><div><button data-action="plus" aria-label="Ampliar modelo">＋</button><button data-action="minus" aria-label="Reduzir modelo">−</button><button data-action="rotate">Girar</button><button data-action="reset">Restaurar</button><a id="back">Ver sem câmera / Voltar</a></div></section><script type="module" src="./scene.js"></script></body></html>
